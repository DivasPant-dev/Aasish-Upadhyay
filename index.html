<!DOCTYPE html>
<html lang="en">
<head>

    <style>

    <script>
        const btn = document.querySelector("button");
        const sound = new Audio("./fart.mp3");

        btn.addEventListener("click", function(){
            sound.volume = 1
            sound.play()
        });
